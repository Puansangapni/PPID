{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="{% static 'images/Logo.jpg' %}" type="image/sm-icon">
    <title>Dashboard</title>
    <link rel="stylesheet" href="{% static 'ppid/css/styles.css' %}">
</head>
<body>
    <header class="header">
        <div class="header-container">
            {% comment %} <img src="{% static 'images/Logo.jpg' %}" alt="Logo PUPR"> {% endcomment %}
            <nav class="navbar">
                <ul class="menu">
                    <li><a href="{% url 'home' %}">Home</a></li>
                    <li><a href="{% url 'contact' %}">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>
    
    <section class="statistics">
        <div class="statistic-box">
            <h2>Total Permohonan Informasi</h2>
            <p>{{ total_permohonan_informasi }}</p>
        </div>
        
        <div class="statistic-box">
            <h2>Total Pengajuan Keberatan</h2>
            <p>{{ total_pengajuan_keberatan }}</p>
        </div>
    </section>
</body>
</html>
